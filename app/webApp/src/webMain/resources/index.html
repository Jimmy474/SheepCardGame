<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheepCardGame</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body style="text-align: center; align-content: center">
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
    <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
    <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
            stroke-dasharray="90 125">
        <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                          repeatCount="indefinite"/>
    </circle>
</svg>
<script type="application/javascript" src="webApp.js"></script>
<script type="module">
    import { DiscordSDK } from "https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@2.5.0/+esm";
    const discordSdk = new DiscordSDK("1534122316597039134");

    async function initDiscord() {
        await discordSdk.setup();

        const { code } = await discordSdk.commands.authorize({
            client_id: "1534122316597039134",
            response_type: "code",
            state: "",
            prompt: "none",
            scope: ["identify"]
        });

        const response = await fetch("api/token", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ code })
        });
        const user = await response.json();

        window.discordEnv = {
            isDM: discordSdk.guildId == null,
            instanceId: discordSdk.instanceId,
            username: user.username
        };

        discordSdk.ready();
    }
    initDiscord();
</script>
</body>
</html>
